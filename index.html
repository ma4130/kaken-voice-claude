<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ことばだま</title>
<meta name="description" content="しゃべった言葉が、すぐに立体の文字になって飛んでいく。声が大きいほど でっかくなる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a0b3d;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body.idle{cursor:none}
body.idle #ctrl{opacity:0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}

#status{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;
  background:rgba(255,255,255,.88);border:2px solid #ffb3e0;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 3px 0 rgba(42,11,61,.1);transition:opacity .4s}
#status i{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
#status.on i{background:#ff3d6b;animation:blink 1.2s ease-in-out infinite}
#status.warn{border-color:#ffb000}
@keyframes blink{50%{opacity:.25}}

#ctrl{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:8px;transition:opacity .4s}
#ctrl button{width:44px;height:44px;border-radius:50%;border:2px solid #ffb3e0;background:rgba(255,255,255,.88);color:var(--ink);font-size:19px;cursor:pointer;padding:0}

#tap{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.6),rgba(200,236,255,.9));cursor:pointer}
#tap .logo{font-family:'Dela Gothic One',sans-serif;font-size:clamp(48px,14vw,120px);line-height:1.05;color:#fff;
  -webkit-text-stroke:3px #2a0b3d;paint-order:stroke fill;
  text-shadow:2px 2px 0 #ff4fb8,4px 4px 0 #e33ba3,6px 6px 0 #c42a8c,8px 8px 0 #a01c72,10px 10px 0 #7a1258,12px 12px 0 #2a0b3d,16px 18px 22px rgba(42,11,61,.3)}
#tap .btn{font:inherit;font-weight:800;font-size:clamp(18px,4.6vw,24px);color:#2a0b3d;background:linear-gradient(#fff36b,#ffb000);
  border:none;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 0 #b86e00,0 12px 24px rgba(0,0,0,.2)}
#tap p{font-weight:800;font-size:14px;line-height:1.7;margin:0;max-width:520px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"><i></i><span id="stText">じゅんびちゅう…</span></div>
<div id="ctrl">
  <button id="bFull" title="全画面">⛶</button>
  <button id="bSnd" title="効果音">🔇</button>
</div>
<div id="tap" class="hide">
  <div class="logo">ことばだま</div>
  <button class="btn" id="bTap">🎤 タップして はじめる</button>
  <p id="tapNote">しゃべった ことばが すぐに 立体の文字になって とんでいくよ。<br>マイクの きょかを おねがいします。</p>
</div>

<script>
'use strict';
const TEST = new URLSearchParams(location.search).has('test');
const FONT = '"Dela Gothic One","Hiragino Kaku Gothic StdN","Hiragino Sans","Meiryo",sans-serif';

// ===== 調整用の数値 =====
const M = {
  stable: 0.25,    // 聞き取りの途中結果が この秒数かわらなければ 先に出す
  maxChars: 10,    // 1つの弾に のせる 最大の文字数
  noWordWait: 0.9, // 大声のあと この秒数 ことばが出なければ「わー！」を出す
  powerAt: [0.3, 0.5, 0.68, 0.85], // 声の大きさ(0〜1)→パワー2,3,4,5の境目
};

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

let W, H, DPR, F, HY, bgCache;
const CAM_Y = 1.6;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  F = Math.min(W, H * 1.2) * 0.9;
  HY = H * 0.36;
  buildBG();
}
function proj(x, y, z) { const s = F / Math.max(z, 0.3); return { x: W / 2 + x * s, y: HY + (CAM_Y - y) * s, s }; }

// ===== 背景 =====
const CLOUDS = Array.from({ length: 6 }, (_, i) => ({ x: (i + Math.random() * 0.6) / 6, y: 0.15 + Math.random() * 0.5, s: 0.6 + Math.random() * 0.6 }));
function buildBG() {
  bgCache = document.createElement('canvas');
  bgCache.width = cv.width; bgCache.height = cv.height;
  const g = bgCache.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, HY);
  sky.addColorStop(0, '#3fb2ff'); sky.addColorStop(0.65, '#8fd8ff'); sky.addColorStop(1, '#fff0f8');
  g.fillStyle = sky; g.fillRect(0, 0, W, HY + 1);
  const R = Math.min(W, H) * 0.11, sx = W * 0.8, sy = HY * 0.32;
  const halo = g.createRadialGradient(sx, sy, R * 0.5, sx, sy, R * 2.6);
  halo.addColorStop(0, 'rgba(255,240,150,.8)'); halo.addColorStop(1, 'rgba(255,240,150,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(sx, sy, R * 2.6, 0, 7); g.fill();
  g.fillStyle = '#ffe14d'; g.strokeStyle = '#ffb000'; g.lineWidth = 4;
  g.beginPath(); g.arc(sx, sy, R, 0, 7); g.fill(); g.stroke();
  for (const c of CLOUDS) {
    const cx = c.x * W, cy = c.y * HY, r = Math.min(W, H) * 0.035 * c.s;
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.beginPath();
    g.arc(cx - r * 1.3, cy + r * 0.3, r * 0.9, 0, 7); g.arc(cx, cy, r * 1.3, 0, 7); g.arc(cx + r * 1.4, cy + r * 0.35, r, 0, 7);
    g.rect(cx - r * 1.3, cy + r * 0.3, r * 2.7, r * 1.05);
    g.fill();
  }
  const gr = g.createLinearGradient(0, HY, 0, H);
  gr.addColorStop(0, '#fff6c9'); gr.addColorStop(0.5, '#ffd9ec'); gr.addColorStop(1, '#ffc2e2');
  g.fillStyle = gr; g.fillRect(0, HY, W, H - HY);
  const glow = g.createLinearGradient(0, HY - 6, 0, HY + 30);
  glow.addColorStop(0, 'rgba(255,255,255,0)'); glow.addColorStop(0.2, 'rgba(255,255,255,.9)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glow; g.fillRect(0, HY - 6, W, 36);
}
let gridOff = 0;
function drawBG() {
  ctx.drawImage(bgCache, 0, 0, W, H);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  for (let x = -42; x <= 42; x += 3) { const a = proj(x, 0, 1.2), b = proj(x, 0, 120); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  ctx.stroke();
  for (let z = 4 - (gridOff % 4); z < 100; z += 4) {
    if (z < 1.2) continue;
    const y = proj(0, 0, z).y;
    ctx.strokeStyle = `rgba(255,120,200,${clamp(1.1 - z / 70, 0.1, 0.75)})`;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

// ===== マイク・音 =====
let AC = null, analyser = null, tbuf = null, noiseBuf = null, sound = false, micOK = false;
function ensureAC() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
async function startMic() {
  ensureAC();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
  const src = AC.createMediaStreamSource(stream);
  analyser = AC.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  tbuf = new Float32Array(analyser.fftSize);
  micOK = true;
}
function readMicDb() {
  if (!analyser || AC.state !== 'running') return -100;
  if (analyser.getFloatTimeDomainData) analyser.getFloatTimeDomainData(tbuf);
  else { const b = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(b); for (let i = 0; i < b.length; i++) tbuf[i] = (b[i] - 128) / 128; }
  let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
  return 20 * Math.log10(Math.sqrt(s / tbuf.length) + 1e-8);
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!sound || !AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!sound || !AC || AC.state !== 'running') return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  fire(p) { tone('sine', 150 + p * 12, 38, 0.28, 0.12 + p * 0.03); noise(0.22, 0.08 + p * 0.03, 900 + p * 300); },
  pop() { noise(0.2, 0.08, 2400); },
};

// ===== ことば判定（聞きながら どんどん出す） =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, wantRec = false, recSess = 0, recOK = !!SR, recLive = '';
const recMap = new Map(); // key → { text, emitted, at, final }
function startRec() {
  if (!SR || recOn || !wantRec) return;
  try {
    rec = new SR(); rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    const sess = ++recSess;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        onRecText(sess + ':' + i, r[0].transcript, r.isFinal);
      }
    };
    rec.onend = () => { recOn = false; flushAll(true); if (wantRec) setTimeout(startRec, 200); };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { wantRec = false; recOK = false; setStatus(); }
    };
    rec.start(); recOn = true;
  } catch (err) { recOn = false; }
  setStatus();
}
const cleanText = t => (t || '').replace(/[。、，．,.!！?？「」『』…・]/g, ' ').replace(/\s+/g, ' ').trim();
function onRecText(key, raw, final) {
  const text = cleanText(raw);
  let st = recMap.get(key);
  if (!st) { st = { text: '', emitted: 0, at: T, final: false }; recMap.set(key, st); }
  if (text !== st.text) { st.text = text; st.at = T; }
  st.final = final;
  if (final) { flush(st); recMap.delete(key); }
}
// まだ出していない ぶんを 弾にする（emitted = 出した文字数。空白は数えない）
const restOf = (t, n) => { let i = 0; for (; i < t.length && n > 0; i++) if (t[i] !== ' ') n--; return t.slice(i); };
function flush(st) {
  const add = restOf(st.text, st.emitted); // 言い直しで 前が かわっても 新しく ふえた ところだけ 出す
  if (!add.replace(/\s/g, '')) return;
  st.emitted += add.replace(/\s/g, '').length;
  for (const w of add.split(' ')) {
    const s = w.replace(/\s/g, '');
    for (let i = 0; i < s.length; i += M.maxChars) emitWord(s.slice(i, i + M.maxChars));
  }
}
function flushAll(force) {
  for (const [k, st] of recMap) if (force || T - st.at >= M.stable) { flush(st); if (force) recMap.delete(k); }
}

// ===== 状態 =====
let T = 0, bullets = [], parts = [], rings = [], pops = [];
let shake = 0, flashW = 0, lines = 0, lastWordAt = -99;
let micDb = -100, lvS = 0, noiseDb = -55, thr = -41, shout = null, calibUntil = 0, recentPeak = 0, pendShout = null;

const levelOf = db => clamp((db + 42) / 34, 0, 1);
const powerOf = lv => 1 + M.powerAt.filter(a => lv >= a).length;
const PCOL = [null,
  { f: ['#e6fbff', '#58c8ff'], s: '#1c4f9a' },
  { f: ['#eaffea', '#4fe07a'], s: '#167040' },
  { f: ['#fffbe0', '#ffd21f'], s: '#9a5c00' },
  { f: ['#fff0dc', '#ff8a2a'], s: '#9a2e08' },
  { f: 'rainbow', s: '#6a0a3a' }];

// ===== 弾（ことばだま） =====
function measureRatio(text) { ctx.font = `100px ${FONT}`; return ctx.measureText(text).width / 100; }
const decorate = (w, p) => w + (p >= 5 ? '！！！' : p >= 4 ? '！！' : p >= 2 ? '！' : '');
function emitWord(word, lv) {
  if (!word) return;
  // 声の大きさ：さいきんの いちばん大きい声（マイクの音がとれないときは まんなか）
  if (lv == null) lv = analyser && AC.state === 'running' ? Math.max(recentPeak, 0.12) : 0.5;
  const power = powerOf(lv);
  const text = decorate(word, power);
  const f = 0.45 + lv * 1.0;
  const n = bullets.filter(b => b.t < 0.6).length; // いっぺんに出たら ずらす
  const b = {
    text, wr: measureRatio(text), f, power, t: 0,
    x: n ? rand(-1.6, 1.6) : rand(-0.4, 0.4), y: 1.0 + n * 0.35, z: 2.2,
    vx: rand(-0.6, 0.6), endZ: rand(24, 32), rot: rand(-0.08, 0.08), alive: true,
  };
  bullets.push(b);
  lastWordAt = T;
  if (pendShout) pendShout = null;
  SFX.fire(power);
  shake = Math.max(shake, 3 + power * 2.5);
  if (power >= 3) lines = 0.3;
  if (power >= 4) flashW = 0.08 + (power - 4) * 0.06;
}
function burst(b) {
  b.alive = false;
  const p = proj(b.x, b.y, b.z), px = clamp(b.f * p.s, 14, 90);
  const chars = [...b.text], n = chars.length;
  const col = PCOL[b.power];
  chars.forEach((ch, i) => {
    const off = (i - (n - 1) / 2) * px * 0.9;
    parts.push({ ch, x: p.x + off, y: p.y, vx: off * 2.2 + rand(-120, 120), vy: rand(-380, -140), g: 900,
      rot: 0, vr: rand(-8, 8), size: px, life: 0.9, max: 0.9, col });
  });
  rings.push({ x: p.x, y: p.y, r: px * 0.4, vr: px * 6, life: 0.35, max: 0.35 });
  SFX.pop();
}

// ===== 毎フレーム =====
function update(dt) {
  T += dt;
  const db = readMicDb();
  micDb = db;
  const lv = levelOf(db);
  lvS += (lv - lvS) * Math.min(1, dt * 14);
  recentPeak = Math.max(lv, recentPeak - dt * 0.45);
  if (T < calibUntil) noiseDb += (db - noiseDb) * Math.min(1, dt * 5);
  else if (!shout && db < noiseDb + 8) noiseDb += (db - noiseDb) * Math.min(1, dt * 1.5);
  thr = clamp(noiseDb + 14, -46, -20);

  // 大きい声（ことばに ならない「わー！」も ひろう）
  if (T > calibUntil && analyser) {
    if (!shout) { if (db > thr) shout = { t0: T, dur: 0, below: 0, peak: lv }; }
    else {
      shout.dur += dt;
      if (db > thr - 3) { shout.below = 0; shout.peak = Math.max(shout.peak, lv); } else shout.below += dt;
      if (shout.below > 0.22 || shout.dur > 2.5) {
        const active = shout.dur - shout.below;
        if (active > 0.15 && shout.peak >= 0.4) pendShout = { at: T, t0: shout.t0, peak: shout.peak, dur: active };
        if (shout.dur > 2.5) noiseDb = Math.max(noiseDb, db - 6);
        shout = null;
      }
    }
  }
  if (pendShout) {
    if (lastWordAt >= pendShout.t0 - 0.3) pendShout = null;
    else if (!(recOK && recOn) || T - pendShout.at > M.noWordWait) {
      const d = pendShout.dur, n = Math.min(6, Math.floor((d - 0.2) / 0.13) + 1);
      emitWord(d < 0.25 ? 'わっ' : n <= 2 ? 'わ' + 'ー'.repeat(n) : 'うわ' + 'あ'.repeat(n - 1), pendShout.peak);
      pendShout = null;
    }
  }
  flushAll(false);
  // いま 聞き取り中の ことば（まだ 出していない ぶん）
  recLive = '';
  for (const st of recMap.values()) { const r = restOf(st.text, st.emitted).replace(/\s/g, ''); if (r) recLive = r; }

  gridOff += dt * 3;
  for (const b of bullets) {
    b.t += dt;
    const v = b.t < 0.3 ? 1 : Math.min(45, 4 + (b.t - 0.3) * 45);
    b.z += v * dt; b.x += b.vx * dt; b.y += (2.4 - b.y) * Math.min(1, dt * 0.8);
    if (b.z >= b.endZ) burst(b);
  }
  bullets = bullets.filter(b => b.alive);
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r += r.vr * dt; }
  rings = rings.filter(r => r.life > 0);
  shake = Math.max(0, shake - dt * 40);
  flashW = Math.max(0, flashW - dt); lines = Math.max(0, lines - dt);
}

// ===== 立体テキスト =====
function frontFill(c, px, wr) {
  if (c.f === 'rainbow') {
    const w = wr * px / 2, g = ctx.createLinearGradient(-w, 0, w, 0);
    for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${(i * 55 + T * 240) % 360},100%,62%)`);
    return g;
  }
  const g = ctx.createLinearGradient(0, -px * 0.5, 0, px * 0.5);
  g.addColorStop(0, c.f[0]); g.addColorStop(0.55, c.f[1]); g.addColorStop(1, c.f[1]);
  return g;
}
function text3D(text, x, y, px, col, o = {}) {
  if (px < 2) return;
  const rot = o.rot || 0;
  const wr = o.wr || (col.f === 'rainbow' ? measureRatio(text) : 1);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.font = `${px}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  let dx = W / 2 - x, dy = HY - y; const L = Math.hypot(dx, dy) || 1;
  const dep = o.depth ?? px * 0.2;
  dx = dx / L * dep; dy = dy / L * dep;
  const c = Math.cos(-rot), s = Math.sin(-rot), rx = dx * c - dy * s, ry = dx * s + dy * c;
  const n = clamp(Math.round(dep / 2.2), 3, 18);
  ctx.fillStyle = col.s; ctx.strokeStyle = col.s; ctx.lineWidth = px * 0.12;
  for (let i = n; i >= 1; i--) { const k = i / n; ctx.strokeText(text, rx * k, ry * k); ctx.fillText(text, rx * k, ry * k); }
  ctx.strokeStyle = '#140626'; ctx.lineWidth = px * 0.13; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = frontFill(col, px, wr); ctx.fillText(text, 0, 0);
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(1, px * 0.025); ctx.strokeText(text, 0, -px * 0.02);
  ctx.restore();
}

// ===== 描画 =====
function drawBullet(b) {
  const p = proj(b.x, b.y, b.z);
  const pop = b.t < 0.18 ? 0.6 + b.t / 0.18 * 0.55 : b.t < 0.3 ? 1.15 - (b.t - 0.18) / 0.12 * 0.15 : 1; // ドーンと出る
  const px = Math.min(b.f * p.s, W * 0.95 / b.wr, H * 0.5) * pop;
  const a = clamp((b.endZ - b.z) / 4, 0, 1);
  text3D(b.text, p.x, p.y, px, PCOL[b.power], { rot: b.rot + Math.sin(b.t * 18) * 0.03, alpha: a, wr: b.wr, depth: px * 0.22 });
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBG();
  bullets.slice().sort((a, b) => b.z - a.z).forEach(drawBullet);
  for (const r of rings) { ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of parts) text3D(p.ch, p.x, p.y, p.size * (0.6 + 0.4 * p.life / p.max), p.col, { rot: p.rot, alpha: clamp(p.life / p.max * 1.5, 0, 1), depth: p.size * 0.15 });
  ctx.restore();

  if (lines > 0) {
    ctx.save(); ctx.globalAlpha = lines / 0.3 * 0.8; ctx.fillStyle = '#fff';
    const cx = W / 2, cy = H * 0.55, R = Math.hypot(W, H);
    for (let i = 0; i < 46; i++) {
      const a = i / 46 * Math.PI * 2 + rand(-0.04, 0.04), w = rand(0.008, 0.02), r0 = R * rand(0.32, 0.45);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R);
      ctx.lineTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a + w) * R, cy + Math.sin(a + w) * R);
      ctx.fill();
    }
    ctx.restore();
  }
  if (flashW > 0) { ctx.fillStyle = `rgba(255,255,255,${flashW * 1.2})`; ctx.fillRect(0, 0, W, H); }

  drawLive();
  drawMeter();
  // しばらく しずかなときの よびかけ
  if (T - lastWordAt > 8 && !recLive && bullets.length === 0) {
    const k = 0.5 + 0.5 * Math.sin(T * 2.2), px = clamp(W / 13, 24, 64);
    text3D('なにか しゃべってみて！', W / 2, H * 0.58, px * (0.96 + k * 0.06), PCOL[3], { depth: px * 0.15, rot: Math.sin(T * 1.3) * 0.03, alpha: 0.75 + k * 0.25 });
  }
}
// 聞き取り中の ことばを 下に うすく出す（すぐ 反応してるのが わかるように）
function drawLive() {
  if (!recLive) return;
  const px = clamp(W / (recLive.length + 2), 22, 64);
  text3D(recLive, W / 2, H - 70, px, { f: ['#fff', '#ffd6f0'], s: '#c42a8c' }, { depth: px * 0.12, alpha: 0.85 });
}
function drawMeter() {
  if (!analyser) return;
  const x = 16, top = H * 0.3, bot = H - 70, h = bot - top, w = 14;
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x - 3, top - 3, w + 6, h + 6);
  ctx.fillStyle = 'rgba(42,11,61,.12)'; ctx.fillRect(x, top, w, h);
  const g = ctx.createLinearGradient(0, bot, 0, top);
  g.addColorStop(0, '#58c8ff'); g.addColorStop(0.35, '#4fe07a'); g.addColorStop(0.6, '#ffd21f'); g.addColorStop(0.8, '#ff8a2a'); g.addColorStop(1, '#ff3d8b');
  ctx.fillStyle = g; ctx.fillRect(x, bot - h * lvS, w, h * lvS);
  ctx.fillStyle = '#2a0b3d'; ctx.font = `800 10px 'M PLUS Rounded 1c',sans-serif`; ctx.textAlign = 'left';
  M.powerAt.forEach((a, i) => { const yy = bot - h * a; ctx.fillRect(x, yy, w, 1.5); ctx.fillText(i + 2, x + w + 5, yy + 4); });
}

// ===== ステータス表示 =====
function setStatus() {
  const el = $('status');
  let txt, on = false, warn = false;
  if (!micOK) { txt = 'マイク じゅんびちゅう…'; }
  else if (AC && AC.state !== 'running') { txt = '画面を クリックすると 声の大きさも はんえい'; warn = true; on = recOK && recOn; }
  else if (!SR || !recOK) { txt = 'ことば判定なし（声の大きさだけ）'; warn = true; }
  else { txt = 'きいてるよ'; on = true; }
  $('stText').textContent = txt;
  el.classList.toggle('on', on); el.classList.toggle('warn', warn);
}

// ===== はじめる =====
async function begin() {
  try {
    await startMic();
    calibUntil = T + 1;
    wantRec = true; startRec();
    $('tap').classList.add('hide');
  } catch (err) {
    $('tap').classList.remove('hide');
    if (err && err.name === 'NotAllowedError') $('tapNote').innerHTML = 'マイクが ブロックされています。<br>アドレスバーの 🔒 から マイクを「許可」してから タップしてね。';
    else if (err) $('tapNote').textContent = 'マイクが つかえませんでした（' + (err.name || 'エラー') + '）。';
  }
  setStatus();
}
$('bTap').onclick = e => { e.stopPropagation(); ensureAC(); begin(); };
$('tap').onclick = () => { ensureAC(); begin(); };
addEventListener('pointerdown', () => { if (AC && AC.state === 'suspended') AC.resume().then(setStatus, () => {}); });
addEventListener('keydown', () => { if (AC && AC.state === 'suspended') AC.resume().then(setStatus, () => {}); });
addEventListener('contextmenu', e => e.preventDefault());
$('bSnd').onclick = () => { sound = !sound; $('bSnd').textContent = sound ? '🔊' : '🔇'; ensureAC(); };
$('bFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
};
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') $('bFull').click(); });
// しばらく さわらなければ カーソルと ボタンを かくす
let idleT = null;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
addEventListener('pointermove', wake); addEventListener('pointerdown', wake); wake();
// タブが もどってきたら 聞き取りを 立て直す
document.addEventListener('visibilitychange', () => { if (!document.hidden && wantRec && !recOn) startRec(); });

// ===== ループ =====
let last = performance.now(), testPause = false, stT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!testPause) update(dt);
  draw();
  stT += dt; if (stT > 1) { stT = 0; setStatus(); }
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`40px "Dela Gothic One"`, 'あ').catch(() => {});
requestAnimationFrame(loop);
if (!TEST) begin(); // ひらいたら すぐ 聞きはじめる（ブロックされたときだけ タップ画面）

// ===== テスト用（?test） =====
if (TEST) {
  window.__kd = {
    // 聞き取りの 途中結果・確定を まねする
    hear(text, final = false, key = 'k') { onRecText('test:' + key, text, final); },
    emit(word, lv = 0.7) { emitWord(word, lv); },
    tick(sec = 1) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); draw(); },
    state() { return { bullets: bullets.map(b => b.text + '@' + b.z.toFixed(1)), live: recLive, pending: [...recMap.values()].map(s => s.text + '|' + s.emitted) }; },
    reload() { location.reload(); },
    pause(on = true) { testPause = on; },
  };
  const q = new URLSearchParams(location.search), scene = q.get('scene');
  if (scene) setTimeout(() => {
    const k = window.__kd; Math.random = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
    k.pause(); recOn = true; micOK = true;
    if (scene === 'words') { k.emit('こんにちは', 0.55); k.tick(0.25); k.emit('すごい', 0.95); k.tick(0.15); k.hear('ことばだま', false); k.tick(0.1); }
    if (scene === 'idle') { k.tick(9); }
    setStatus();
  }, 600);
}
</script>
